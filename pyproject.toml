[project]
name = "colombia_dian_comex"
version = "0.1.0"
description = "Análisis de datos de la Dirección de Impuestos y Aduanas Nacionales (DIAN) para comercio exterior en Colombia"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Fernanda Aguirre Ruiz"}
]

dependencies = [
    "ipykernel",
    "nbformat",
    "polars",
    "requests",
    "fastexcel>=0.21.0",
    "tqdm>=4.70.1",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
colombia-dian-dictionary = "colombia_dian_comex.dictionary:main"
colombia-dian-download = "colombia_dian_comex.download:main"
colombia-dian-query = "colombia_dian_comex.query:main"
colombia-dian-sync = "colombia_dian_comex.sync:main"
colombia-dian-update = "colombia_dian_comex.update:main"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
    "types-requests>=2.33.0.20261006",
    "types-tqdm>=4.70.0.20260906",
]
